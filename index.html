<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic-Tac-Toe</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎮 Tic-Tac-Toe</h1>
        
        <div class="game-mode">
            <button class="mode-btn active" data-mode="player">👥 vs Player</button>
            <button class="mode-btn" data-mode="ai">🤖 vs AI</button>
        </div>

        <div class="scoreboard">
            <div class="score">
                <span class="score-label">Player X</span>
                <span class="score-value" id="scoreX">0</span>
            </div>
            <div class="score">
                <span class="score-label">Ties</span>
                <span class="score-value" id="scoreTie">0</span>
            </div>
            <div class="score">
                <span class="score-label">Player O</span>
                <span class="score-value" id="scoreO">0</span>
            </div>
        </div>

        <div class="game-board" id="gameBoard">
            <div class="cell" data-index="0"></div>
            <div class="cell" data-index="1"></div>
            <div class="cell" data-index="2"></div>
            <div class="cell" data-index="3"></div>
            <div class="cell" data-index="4"></div>
            <div class="cell" data-index="5"></div>
            <div class="cell" data-index="6"></div>
            <div class="cell" data-index="7"></div>
            <div class="cell" data-index="8"></div>
        </div>

        <div class="game-status">
            <span id="statusMessage">Player X's turn</span>
        </div>

        <div class="controls">
            <button class="btn btn-reset" id="resetGame">🔄 New Game</button>
            <button class="btn btn-reset" id="resetScore">📊 Reset Score</button>
        </div>

        <div class="winning-overlay" id="winningOverlay">
            <div class="winning-content">
                <h2 id="winnerMessage">🎉 Winner!</h2>
                <button class="btn btn-play-again" id="playAgain">Play Again</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
